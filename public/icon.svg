<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Shut the Box">
  <title>Shut the Box</title>
  <!-- The board itself: green felt in a brass-rimmed tray, two tiles standing
       and one flipped down. Geometry rather than an emoji, so it renders the
       same on every phone and stays legible at 48px. -->
  <defs>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3BC83"/>
      <stop offset="1" stop-color="#C08F4E"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#357B59"/>
      <stop offset="1" stop-color="#1F4D37"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#felt)"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none"
        stroke="#C9973A" stroke-width="16"/>

  <!-- Two tiles up, one down: the whole game in one picture. -->
  <g>
    <rect x="92" y="150" width="104" height="150" rx="18" fill="url(#oak)"/>
    <rect x="92" y="150" width="104" height="150" rx="18" fill="none"
          stroke="#7A5024" stroke-width="7"/>
    <text x="144" y="252" font-family="Georgia, 'Times New Roman', serif"
          font-size="104" font-weight="700" fill="#3A2413" text-anchor="middle">1</text>

    <rect x="216" y="150" width="104" height="150" rx="18" fill="url(#oak)"/>
    <rect x="216" y="150" width="104" height="150" rx="18" fill="none"
          stroke="#7A5024" stroke-width="7"/>
    <text x="268" y="252" font-family="Georgia, 'Times New Roman', serif"
          font-size="104" font-weight="700" fill="#3A2413" text-anchor="middle">2</text>

    <!-- Flipped down: shorter, darker, sunk into the felt. -->
    <rect x="340" y="252" width="104" height="48" rx="14" fill="#8A5F2E"/>
    <rect x="340" y="252" width="104" height="48" rx="14" fill="none"
          stroke="#5B3C18" stroke-width="7"/>
  </g>

  <!-- The tray lip the tiles sit in. -->
  <rect x="80" y="308" width="376" height="26" rx="13" fill="#7A5024"/>
</svg>
